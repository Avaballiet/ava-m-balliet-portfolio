<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ava M. Balliet — Photography portfolio.">
  <title>PHOTOGRAPHY — Ava M. Balliet</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .photography-page {
      width: min(1400px, 100%);
      margin: 0 auto;
      padding: 70px 42px 90px;
    }
    .photography-header {
      max-width: 900px;
      margin: 0 auto 42px;
      text-align: center;
    }
    .photography-header h1 {
      margin: 0 0 18px;
      font-size: clamp(3rem, 7vw, 6.5rem);
      line-height: .95;
    }
    .photography-header p {
      margin: 0 auto;
      max-width: 720px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 1rem;
    }
    .back-link {
      display: block;
      width: fit-content;
      margin: 34px auto 0;
      color: var(--accent);
      text-decoration: none;
      font-size: .76rem;
      letter-spacing: .08em;
    }
    .back-link:hover,
    .back-link:focus-visible { color: var(--text); }
    .photo-gallery {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-auto-flow: dense;
      gap: 14px;
      align-items: start;
    }
    .photo-tile {
      margin: 0;
      position: relative;
      overflow: hidden;
      cursor: zoom-in;
      background: var(--line);
    }
    .photo-tile.feature { grid-column: span 2; }
    .photo-tile.wide { grid-column: span 2; }
        .photo-tile img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      transition: transform 260ms ease;
    }
    .photo-tile.wide img { aspect-ratio: 3 / 2; }
    .photo-tile.feature img { aspect-ratio: 16 / 10; }
    .photo-tile.tall img { aspect-ratio: 3 / 4; }
    .photo-tile:hover img,
    .photo-tile:focus-visible img { transform: scale(1.015); }
    .photo-tile button {
      display: block;
      width: 100%;
      padding: 0;
      margin: 0;
      border: 0;
      background: transparent;
      cursor: zoom-in;
    }
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 5vw;
      background: rgba(55, 31, 22, .92);
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 92vw;
      max-height: 90vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }
    .lightbox-close {
      position: absolute;
      top: 16px;
      right: 25px;
      color: #fff8ef;
      background: transparent;
      border: 0;
      font-size: 44px;
      line-height: 1;
      cursor: pointer;
    }
    @media (max-width: 900px) {
      .photography-page { padding: 55px 24px 70px; }
      .photo-gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .photo-tile.feature, .photo-tile.wide { grid-column: span 2; }
    }
    @media (max-width: 650px) {
      .photography-page { padding: 40px 18px 60px; }
      .photography-header { margin-bottom: 42px; }
      .photo-gallery { grid-template-columns: 1fr; gap: 10px; }
      .photo-tile.feature, .photo-tile.wide, .photo-tile.tall { grid-column: span 1; grid-row: auto; }
      .photo-tile img, .photo-tile.wide img, .photo-tile.feature img, .photo-tile.tall img { aspect-ratio: 4 / 3; }
    }
    @media (prefers-reduced-motion: reduce) {
      .photo-tile img { transition: none; }
    }
  </style>
</head>
<body>
  <main class="photography-page">
    <header class="photography-header">
      <h1>PHOTOGRAPHY</h1>
      <p>All photos were taken on a Canon SX530 HS within the past three years!</p>
    </header>

    <section class="photo-gallery" aria-label="Photography gallery">
      <figure class="photo-tile feature"><button type="button"><img src="photo-01.jpg" alt="Photography portfolio image" loading="eager"></button></figure>
      <figure class="photo-tile wide"><button type="button"><img src="photo-04.jpg" alt="Photography portfolio image" loading="lazy"></button></figure>
      <figure class="photo-tile tall"><button type="button"><img src="photo-15.jpg" alt="Photography portfolio image" loading="lazy"></button></figure>
      <figure class="photo-tile"><button type="button"><img src="photo-03.jpg" alt="Photography portfolio image" loading="lazy"></button></figure>
      <figure class="photo-tile wide"><button type="button"><img src="photo-05.jpg" alt="Photography portfolio image" loading="lazy"></button></figure>
      <figure class="photo-tile"><button type="button"><img src="photo-11.jpg" alt="Photography portfolio image" loading="lazy"></button></figure>
      <figure class="photo-tile tall"><button type="button"><img src="photo-21.jpg" alt="Photography portfolio image" loading="lazy"></button></figure>
      <figure class="photo-tile feature"><button type="button"><img src="photo-13.jpg" alt="Photography portfolio image" loading="lazy"></button></figure>
      <figure class="photo-tile"><button type="button"><img src="photo-16.jpg" alt="Photography portfolio image" loading="lazy"></button></figure>
      <figure class="photo-tile wide"><button type="button"><img src="photo-09.jpg" alt="Photography portfolio image" loading="lazy"></button></figure>
      <figure class="photo-tile"><button type="button"><img src="photo-19.jpg" alt="Photography portfolio image" loading="lazy"></button></figure>
      <figure class="photo-tile tall"><button type="button"><img src="photo-10.jpg" alt="Photography portfolio image" loading="lazy"></button></figure>
      <figure class="photo-tile wide"><button type="button"><img src="photo-06.jpg" alt="Photography portfolio image" loading="lazy"></button></figure>
      <figure class="photo-tile"><button type="button"><img src="photo-12.jpg" alt="Photography portfolio image" loading="lazy"></button></figure>
      <figure class="photo-tile feature"><button type="button"><img src="photo-22.jpg" alt="Photography portfolio image" loading="lazy"></button></figure>
      <figure class="photo-tile"><button type="button"><img src="photo-08.jpg" alt="Photography portfolio image" loading="lazy"></button></figure>
      <figure class="photo-tile wide"><button type="button"><img src="photo-07.jpg" alt="Photography portfolio image" loading="lazy"></button></figure>
      <figure class="photo-tile tall"><button type="button"><img src="photo-17.jpg" alt="Photography portfolio image" loading="lazy"></button></figure>
      <figure class="photo-tile"><button type="button"><img src="photo-20.jpg" alt="Photography portfolio image" loading="lazy"></button></figure>
    </section>

    <a class="back-link" href="index.html">← BACK TO HOME</a>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" type="button" aria-label="Close image">×</button>
    <img id="lightbox-image" src="" alt="">
  </div>

  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightbox-image');
    const closeButton = document.querySelector('.lightbox-close');

    document.querySelectorAll('.photo-tile button').forEach((button) => {
      button.addEventListener('click', () => {
        const image = button.querySelector('img');
        lightboxImage.src = image.src;
        lightboxImage.alt = image.alt;
        lightbox.classList.add('open');
        lightbox.setAttribute('aria-hidden', 'false');
      });
    });

    function closeLightbox() {
      lightbox.classList.remove('open');
      lightbox.setAttribute('aria-hidden', 'true');
      lightboxImage.src = '';
    }

    closeButton.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (event) => {
      if (event.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeLightbox();
    });
  </script>
</body>
</html>
